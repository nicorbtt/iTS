[metadata]
name = tweediegp
version = 0.0.0
description = Intermittent demand GP utilities
long_description = file: README.md
long_description_content_type = text/markdown
author = Local
license = Proprietary

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy
    gpytorch >= 2.2
    torch >= 1.11

[options.packages.find]
where = .
